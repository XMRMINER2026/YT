          import android.content.Context;
          import android.content.Intent;
          import android.util.Log;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction())) {
                      try {
                          OverlayManager.get(context).dismiss();
                      } catch (Exception e) {
                          Log.e("BootReceiver", "overlay dismiss on boot failed", e);
                      }
                      try {
                          TelegramQueue.get(context).registerNetworkCallback();
                          TelegramQueue.get(context).flush();
                      } catch (Exception e) {
                          Log.e("BootReceiver", "flush on boot failed", e);
                      }
                  }
              }
          }
